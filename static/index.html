<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chat</title>
<style>
  body { font-family: monospace; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { white-space: pre-wrap; line-height: 1.6; }
  button { display: block; margin: 0 auto 1rem; }
</style>
</head>
<body>
<button id="btn">Start</button>
<div id="log"></div>

<script>
const btn = document.getElementById("btn");
const log = document.getElementById("log");

let ws, audioCtx, micStream, workletNode, playbackCtx, nextPlayTime;

function append(text) { log.textContent += text + "\n"; log.scrollIntoView(false); }

const workletCode = `
class P extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; }
  process(inputs) {
    const s = inputs[0]?.[0];
    if (!s) return true;
    const ratio = sampleRate / 16000;
    for (let i = 0; i < s.length; i += ratio) {
      const idx = Math.floor(i);
      if (idx < s.length) this.buf.push(s[idx]);
    }
    if (this.buf.length >= 1024) {
      const chunk = this.buf.splice(0, 1024);
      const pcm = new Int16Array(chunk.length);
      for (let i = 0; i < chunk.length; i++) {
        const v = Math.max(-1, Math.min(1, chunk[i]));
        pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
      }
      this.port.postMessage(pcm.buffer, [pcm.buffer]);
    }
    return true;
  }
}
registerProcessor("pcm-processor", P);
`;

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new AudioContext();
  const url = URL.createObjectURL(new Blob([workletCode], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  const src = audioCtx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioCtx, "pcm-processor");
  workletNode.port.onmessage = (e) => { if (ws?.readyState === 1) ws.send(e.data); };
  src.connect(workletNode);
}

function stopMic() {
  workletNode?.disconnect(); audioCtx?.close(); micStream?.getTracks().forEach(t => t.stop());
  workletNode = audioCtx = micStream = null;
}

function playPcm(bytes) {
  if (!playbackCtx) return;
  const int16 = new Int16Array(bytes);
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 0x8000;
  const buf = playbackCtx.createBuffer(1, f32.length, 24000);
  buf.getChannelData(0).set(f32);
  const src = playbackCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playbackCtx.destination);
  const t = Math.max(playbackCtx.currentTime, nextPlayTime);
  src.start(t);
  nextPlayTime = t + buf.duration;
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/audio`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => append("[connected]");
  ws.onclose = () => append("[disconnected]");
  ws.onerror = () => append("[error]");
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) return playPcm(e.data);
    const msg = JSON.parse(e.data);
    if (msg.type === "input_transcription" && msg.text) append("you: " + msg.text);
    else if (msg.type === "output_transcription" && msg.text) append("ai: " + msg.text);
    else if (msg.type === "interrupted" && playbackCtx) { playbackCtx.close(); playbackCtx = new AudioContext({ sampleRate: 24000 }); nextPlayTime = 0; }
    else if (msg.type === "error") append("[error] " + msg.message);
  };
}

let active = false;
btn.onclick = async () => {
  if (!active) {
    try {
      playbackCtx = new AudioContext({ sampleRate: 24000 }); nextPlayTime = 0;
      await startMic();
      connect();
      btn.textContent = "Stop";
      active = true;
    } catch (err) { append("[mic error] " + err.message); }
  } else {
    stopMic();
    ws?.close();
    playbackCtx?.close(); playbackCtx = null;
    btn.textContent = "Start";
    active = false;
  }
};
</script>
</body>
</html>
